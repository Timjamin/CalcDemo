<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVIL calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>EVIL calculator that HATES you</h1>
    <div class="calculator">
      <input type="text" id="result" readonly />
      <div class="buttons">
        <button class="clear">C</button>
        <button class="operator">/</button>
        <button class="operator">*</button>
        <button class="operator">-</button>
        <button class="number">sivin</button>
        <button class="number">ate</button>
        <button class="number">nein</button>
        <button class="operator">+</button>
        <button class="number">for</button>
        <button class="number">fyv</button>
        <button class="number">syx</button>
        <button class="equals">=</button>
        <button class="number">one</button>
        <button class="number">two</button>
        <button class="number">skip a few</button>
        <button class="number">zero </button>
        <button class="decimal">.</button>
      </div>
    </div>
    <div>
      Links to other versions:
      <ul>
        <li><a href="./index.html">Fully Featured</a></li>
        <li><a href="./pages/plainHTML.html">Just HTML</a></li>
        <li><a href="./pages/addCSS.html">HTML+CSS</a></li>
        <li><a href="./pages/addJS.html">HTML+JS</a></li>
      </ul>
    </div>
    <script src="index.js"></script>
  </body>
</html>
